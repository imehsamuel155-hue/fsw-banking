<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIC Code | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/style.css">
    <style>
        /* --- Global Reset & Page Layout --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #1a202c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Container Card --- */
        .tic-container {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 36px 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        /* --- Headings & Paragraphs --- */
        .tic-container h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a365d;
            /* Dark navy accent */
            margin-bottom: 8px;
        }

        .tic-container p {
            font-size: 13px;
            color: #718096;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .tic-container h2 {
            font-size: 16px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }

        /* --- Form Elements --- */
        #ticForm {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        #ticForm label {
            font-size: 13px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
        }

        #ticForm input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #f8fafc;
        }

        #ticForm input[type="text"]:focus {
            border-color: #2b6cb0;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }

        /* --- Error Message --- */
        #errorMsg {
            font-size: 13px;
            color: #e53e3e !important;
            background-color: #fff5f5;
            border: 1px solid #feb2b2;
            padding: 10px;
            border-radius: 6px;
            margin-top: 14px;
            text-align: center;
        }

        /* --- Submit Button --- */
        #ticForm button[type="submit"] {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            background-color: #2b6cb0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        #ticForm button[type="submit"]:hover {
            background-color: #2c5282;
        }

        #ticForm button[type="submit"]:active {
            transform: translateY(1px);
        }

        .customer-service {

            position: fixed;

            right: 25px;

            bottom: 25px;

            background: #071a52;

            color: #fff;

            padding: 12px 18px;

            border-radius: 999px;

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(7, 26, 82, .25);

            z-index: 2999;

            transition: transform .15s, background .15s;

        }

        .customer-service:hover {

            background: #0b63ce;

            transform: translateY(-2px);

        }

        #customerPopup {

            position: fixed;

            right: 25px;

            bottom: 100px;

            width: 360px;

            max-width: 90vw;

            background: #fff;

            border-radius: 15px;

            overflow: hidden;

            display: none;

            flex-direction: column;

            box-shadow: 0 20px 40px rgba(0, 0, 0, .18);

            z-index: 3000;

        }

        .popup-header {

            background: #071a52;

            color: #fff;

            padding: 15px 20px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }

        .popup-header h3 {

            font-size: 16px;

            margin: 0;

        }

        #closeChat {

            background: none;

            border: none;

            color: #fff;

            font-size: 18px;

            cursor: pointer;

            transition: opacity .2s;

        }

        #closeChat:hover {

            opacity: 0.8;

        }

        .popup-body {

            height: 320px;

            overflow-y: auto;

            padding: 20px;

            background: #f5f7fb;

        }

        .message {

            padding: 12px 16px;

            border-radius: 12px;

            margin-bottom: 15px;

            max-width: 85%;

        }

        .support {

            background: #071a52;

            color: white;

        }

        .user {

            background: #19b5fe;

            color: white;

            margin-left: auto;

        }

        .popup-footer {

            display: flex;

            padding: 15px;

            gap: 10px;

            background: #fff;

        }

        .popup-footer input {

            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

        }

        .popup-footer button {

            width: 50px;

            background: #0b63ce;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

        }
    </style>
</head>


<body>


    <div class="tic-container">


        <h1>
            Transfer Initiate Enter (Transfer Pin)
        </h1>


        <p>
            KINDLY CONTACT: Customer Service for more information.
        </p>


        <h2>
            Almost Finished!
        </h2>



        <form id="ticForm">


            <label>
                Input (Transfer Pin)
            </label>



            <input type="text" id="ticCode" placeholder="Enter Transfer Pin" required>



            <p id="errorMsg" style="display:none;color:red;font-weight:bold;">

                Error: Invalid Request

            </p>




            <button type="submit">

                Validate Transfer

            </button>



        </form>


    </div>

    <div class="customer-service" id="customerIcon">

        <i class="fas fa-headset"></i>

        <span>Customer Service</span>

    </div>

    <div id="customerPopup">

        <div class="popup-header">

            <h3>Customer Service</h3>

            <button id="closeChat">

                <i class="fas fa-times"></i>

            </button>

        </div>

        <div class="popup-body" id="chatMessages">

            <div class="message support">

                Hello 👋<br>
                Welcome to First Smart Wave Banking.

            </div>

            <div class="message support">

                How may we assist you today?

            </div>

        </div>

        <div class="popup-footer">

            <input type="text" id="chatInput" placeholder="Type your message...">


            <label style="cursor:pointer;">
                <i class="fas fa-image"></i>

                <input type="file" accept="image/*" hidden onchange="sendCustomerImage(event)">

            </label>


            <button id="sendMessage">

                <i class="fas fa-paper-plane"></i>

            </button>


        </div>

    </div>





    <script src="/fsw-shared.js"></script>
    <script>if (!fswRequireAuth()) { }</script>
    <script>

        (function () {
            const el = document.getElementById('customerService') || document.getElementById('customerIcon');
            if (el) { el.style.cursor = 'pointer'; el.onclick = function () { location.href = '/support'; }; }
        })();


        const ticForm = document.getElementById("ticForm");

        if (ticForm) {

            ticForm.addEventListener("submit", async function (e) {

                e.preventDefault();

                const enteredCode = document.getElementById("ticCode").value.trim();
                const errorMsg = document.getElementById("errorMsg");
                errorMsg.style.display = "none";

                const transferId = sessionStorage.getItem('fsw_pending_transfer_id');
                if (!transferId) {
                    errorMsg.textContent = 'No pending transfer found — please start the transfer again.';
                    errorMsg.style.display = 'block';
                    return;
                }

                const submitBtn = ticForm.querySelector('button[type="submit"]');
                if (submitBtn) fswBtnStart(submitBtn, 'Verifying...');

                try {
                    const res = await fetch(`${FSW_API_BASE}/transfers/${transferId}/verify-tic`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ticCode: enteredCode }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Invalid TIC code');

                    sessionStorage.setItem('fsw_pending_transfer_id', transferId);
                    window.location.href = '/tax-code';
                } catch (err) {
                    errorMsg.textContent = err.message === 'Failed to fetch'
                        ? "Can't reach the backend — make sure it's running (npm run dev)."
                        : err.message;
                    errorMsg.style.display = "block";
                } finally {
                    if (submitBtn) fswBtnStop(submitBtn);
                }

            });

        }
    </script>


    <script src="/script.js"></script>

</body>

</html>
