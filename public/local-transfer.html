INTERNATIONAL & LOCAL TRANSFER PAGE
======================================*/

        .transfer-page {

        }

        .transfer-card {

            background: #fff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .12);

            color: #071a52;
            font-weight: 600;
            font-size: 15px;
        }

        .input-box input,

            width: 100%;
            padding: 15px;
            border: 1px solid #d7d7d7;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: .3s;
            background: #fff;
        }

        .input-box input:focus,
        .input-box select:focus,
        .input-box textarea:focus {
            border-color: #0b63ce;
            box-shadow: 0 0 10px rgba(11, 99, 206, .25);
        }

        .input-box textarea {
            resize: vertical;
            min-height: 120px;
        }

        .transfer-buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 35px;
        }

        .transfer-buttons button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
            font-weight: 600;
        }

        .transfer-buttons button:first-child {

            color: #333;
        }

        .transfer-buttons button:first-child:hover {

        }

        .transfer-buttons button:last-child {

            align-items: center;
            border-radius: 50%;

            color: #071a52;
            text-decoration: none;

            background: #071a52;

        }

    <script>if (!fswRequireAuth()) { }</script>
    <script>


        (function () {
            const acc = document.getElementById('accountNumber');
            const err = document.getElementById('accountNumberError');
            if (!acc) return;
            acc.addEventListener('input', function () {
                // digits only
                this.value = this.value.replace(/\D/g, '').slice(0, 10);
                if (err) {
                    if (this.value.length === 0) { err.style.display = 'none'; return; }
                    if (this.value.length !== 10) {
                        err.textContent = 'Please input correct account number';
                        err.style.display = 'block';
                    } else {
                        err.style.display = 'none';
                    }
                }
            });
        })();

        const transferForm = document.getElementById("localTransferForm");

        if (transferForm) {

            transferForm.addEventListener("submit", async function (e) {

                e.preventDefault();

                const accNum = String(document.getElementById("accountNumber").value || '').replace(/\D/g, '');
                if (!/^[0-9]{10}$/.test(accNum)) {
                    const err = document.getElementById('accountNumberError');
                    if (err) { err.textContent = 'Please input correct account number'; err.style.display = 'block'; }
                    alert('Please input correct account number');
                    return;
                }
                const countryEl = document.getElementById("country");
                const swiftEl = document.getElementById("swiftCode");
                const descEl = document.getElementById("description");
                const transferData = {
                    type: 'local',
                    recipientName: document.getElementById("recipientName").value.trim(),
                    recipientBank: document.getElementById("recipientBank").value.trim(),
                    recipientAccountNumber: accNum,
                    iban: accNum,
                    country: countryEl ? countryEl.value.trim() : '',
                    swift: swiftEl ? swiftEl.value.trim() : '',
                    currency: document.getElementById("currency").value,
                    amount: Number(document.getElementById("amount").value),
                    purpose: document.getElementById("purpose").value,
                    description: descEl ? descEl.value.trim() : '',
                };

                const submitBtn = transferForm.querySelector('button[type="submit"]');
                if (submitBtn) fswBtnStart(submitBtn, 'Processing...');

                try {
                    const userId = await fswGetCurrentUserId();
                    const res = await fetch(`${FSW_API_BASE}/transfers`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, ...transferData }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Transfer could not be created');

                    sessionStorage.setItem('fsw_pending_transfer_id', data._id);
                    const gate = data.nextGate || 'tic';
                    sessionStorage.setItem('fsw_transfer_gate', gate);
                    if (gate === 'receipt') {
                        // complete without code — call tax with special? better verify-receipt endpoint
                        // For receipt_only we still need server complete — use tax with skip via mode
                        window.location.href = '/tax-code?auto=1';
                    } else if (gate === 'tax') {
                        window.location.href = '/tax-code';
                    } else {
                        window.location.href = '/tic-code';
                    }
                } catch (err) {
                    alert(err.message === 'Failed to fetch'
                        ? "Can't reach the backend — make sure it's running (npm run dev)."
                        : err.message);
                } finally {
                    if (submitBtn) fswBtnStop(submitBtn);
                }

            });

        }

    </script>
