<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top {
            background: #071a52;
            color: #fff;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .top h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, .3);
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 130px);
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-word;
        }

        .message.support {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e6ebf3;
            color: #333;
        }

        .message.user {
            align-self: flex-end;
            background: #0b63ce;
            color: #fff;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            cursor: pointer;
        }

        .footer {
            background: #fff;
            border-top: 1px solid #e6ebf3;
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .footer input[type=text] {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d0d7e6;
            border-radius: 24px;
            font-size: 15px;
        }

        .footer button,
        .footer label {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #0b63ce;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
        }

        #lightbox .x {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        @media (max-width:480px) {
            .top h1 {
                font-size: 16px;
            }

            .message {
                max-width: 92%;
            }
        }
    </style>
</head>

<body>
    <div class="top">
        <h1><i class="fas fa-headset"></i> Customer Service</h1>
        <button class="close-btn" id="exitSupport" title="Close" aria-label="Close"><i
                class="fas fa-times"></i></button>
    </div>
    <div id="chatMessages">
        <div class="message support">Hello! How may we assist you today?</div>
    </div>
    <div class="footer">
        <input type="text" id="chatInput" placeholder="Type your message...">
        <label title="Send image">
            <i class="fas fa-image"></i>
            <input type="file" accept="image/*" hidden id="chatImage">
        </label>
        <button id="sendMessage" title="Send"><i class="fas fa-paper-plane"></i></button>
    </div>
    <div id="lightbox"><button class="x" id="lbClose">&times;</button><img id="lbImg" src="" alt=""></div>
    <script src="/fsw-shared.js"></script>
    <script>
        if (!fswRequireAuth()) { }
        document.getElementById('exitSupport').onclick = () => {
            if (history.length > 1) history.back();
            else location.href = '/dashboard';
        };
        const box = document.getElementById('chatMessages');
        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendMessage');
        function addMsg(text, who, img) {
            const d = document.createElement('div');
            d.className = 'message ' + who;
            d.textContent = text || '';
            if (img) {
                const im = document.createElement('img');
                im.src = img;
                im.onclick = () => { document.getElementById('lbImg').src = img; document.getElementById('lightbox').style.display = 'flex'; };
                d.appendChild(im);
            }
            box.appendChild(d);
            box.scrollTop = box.scrollHeight;
        }
        async function loadChat() {
            try {
                const id = await fswGetCurrentUserId();
                const msgs = await fswGetChat(id);
                box.innerHTML = '';
                if (!msgs || !msgs.length) addMsg('Hello! How may we assist you today?', 'support');
                else msgs.forEach(m => addMsg(m.text, m.from === 'admin' ? 'support' : 'user', m.image));
            } catch (e) { }
        }
        async function send(text, image) {
            if (!text && !image) return;
            try {
                const id = await fswGetCurrentUserId();
                await fswSendCustomerMessage(text, image);
                input.value = '';
                await loadChat();
            } catch (e) { alert(e.message); }
        }
        sendBtn.onclick = () => send(input.value.trim());
        input.onkeydown = (e) => { if (e.key === 'Enter') send(input.value.trim()); };
        document.getElementById('chatImage').onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => send('', r.result);
            r.readAsDataURL(f);
        };
        document.getElementById('lbClose').onclick = () => { document.getElementById('lightbox').style.display = 'none'; };
        document.getElementById('lightbox').onclick = (e) => { if (e.target.id === 'lightbox') e.target.style.display = 'none'; };
        loadChat();
        setInterval(loadChat, 5000);
    </script>
</body>

</html>
