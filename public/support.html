<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Customer Service | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #eef2f7;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            max-width: 640px;
            margin: 0 auto;
            background: #f4f6fb;
        }

        .top {
            flex-shrink: 0;
            background: #071a52;
            color: #fff;
            padding: 12px 14px;
            padding-top: max(12px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 5;
        }

        .top h1 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        #chatMessages {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 14px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.45;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        /* Admin / support = LEFT */
        .message.admin,
        .message.support {
            align-self: flex-start;
            background: #ffffff;
            color: #1a202c;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        /* Customer = RIGHT */
        .message.customer,
        .message.user {
            align-self: flex-end;
            background: #0b63ce;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message .meta {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 4px;
        }

        .message img {
            display: block;
            max-width: min(220px, 70vw);
            max-height: 220px;
            border-radius: 10px;
            margin-top: 6px;
            cursor: pointer;
            object-fit: cover;
        }

        .footer {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #e6ebf3;
            padding: 10px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .footer input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid #d0d7e6;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
        }

        .footer input[type="text"]:focus {
            border-color: #0b63ce;
        }

        .footer button,
        .footer label {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #0b63ce;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .9);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lightbox.show {
            display: flex;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
        }

        #lightbox .x {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: 12px;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        @media (max-width: 400px) {
            .message {
                max-width: 90%;
                font-size: 14px;
            }

            .top h1 {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="top">
            <h1><i class="fas fa-headset"></i> Customer Service</h1>
            <button class="close-btn" id="exitSupport" type="button" title="Close" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div id="chatMessages"></div>
        <div class="footer">
            <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">
            <label title="Send photo">
                <i class="fas fa-image"></i>
                <input type="file" accept="image/*" hidden id="chatImage">
            </label>
            <button type="button" id="sendMessage" title="Send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <div id="lightbox">
        <button type="button" class="x" id="lbClose">&times;</button>
        <img id="lbImg" src="" alt="Preview">
    </div>

    <script src="/fsw-shared.js"></script>
    <script>
        (function () {
            if (typeof fswRequireAuth === 'function' && !fswRequireAuth()) return;

            var box = document.getElementById('chatMessages');
            var input = document.getElementById('chatInput');
            var sendBtn = document.getElementById('sendMessage');
            var lastCount = -1;

            document.getElementById('exitSupport').onclick = function () {
                if (history.length > 1) history.back();
                else location.href = '/dashboard';
            };

            function openLightbox(src) {
                document.getElementById('lbImg').src = src;
                document.getElementById('lightbox').classList.add('show');
            }
            document.getElementById('lbClose').onclick = function () {
                document.getElementById('lightbox').classList.remove('show');
            };
            document.getElementById('lightbox').onclick = function (e) {
                if (e.target.id === 'lightbox') e.target.classList.remove('show');
            };

            function formatTime(iso) {
                try {
                    return new Date(iso).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                } catch (e) { return ''; }
            }

            function addBubble(msg) {
                var sender = (msg.sender || msg.from || 'customer').toLowerCase();
                var isAdmin = (sender === 'admin' || sender === 'support');
                var d = document.createElement('div');
                d.className = 'message ' + (isAdmin ? 'admin' : 'customer');

                if (msg.text) {
                    var t = document.createElement('div');
                    t.textContent = msg.text;
                    d.appendChild(t);
                }
                if (msg.image) {
                    var im = document.createElement('img');
                    im.src = msg.image;
                    im.alt = 'Photo';
                    im.onclick = function () { openLightbox(msg.image); };
                    d.appendChild(im);
                }
                var meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = (isAdmin ? 'Support' : 'You') + (msg.createdAt ? ' · ' + formatTime(msg.createdAt) : '');
                d.appendChild(meta);
                box.appendChild(d);
            }

            function welcome() {
                box.innerHTML = '';
                addBubble({
                    sender: 'admin',
                    text: 'Hello 👋 Welcome to First Smart Wave Banking. How may we assist you today?',
                    createdAt: new Date().toISOString()
                });
            }

            async function loadChat(forceScroll) {
                try {
                    var msgs = await fswGetChat();
                    if (!Array.isArray(msgs)) msgs = [];
                    if (msgs.length === lastCount && !forceScroll) return;
                    lastCount = msgs.length;
                    var nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
                    box.innerHTML = '';
                    if (!msgs.length) {
                        welcome();
                    } else {
                        msgs.forEach(addBubble);
                    }
                    if (forceScroll || nearBottom) {
                        box.scrollTop = box.scrollHeight;
                    }
                } catch (e) {
                    if (!box.children.length) {
                        box.innerHTML = '<div class="message admin">Could not load chat. Check your connection and try again.</div>';
                    }
                }
            }

            async function send(text, image) {
                text = (text || '').trim();
                if (!text && !image) return;
                try {
                    await fswSendCustomerMessage(text, image || '');
                    input.value = '';
                    await loadChat(true);
                } catch (err) {
                    alert(err.message || 'Could not send message');
                }
            }

            sendBtn.onclick = function () { send(input.value); };
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    send(input.value);
                }
            });
            document.getElementById('chatImage').onchange = function (e) {
                var file = e.target.files && e.target.files[0];
                if (!file) return;
                if (file.size > 2.5 * 1024 * 1024) {
                    alert('Image is too large. Please use a photo under 2.5 MB.');
                    e.target.value = '';
                    return;
                }
                var reader = new FileReader();
                reader.onload = function () { send('', reader.result); };
                reader.readAsDataURL(file);
                e.target.value = '';
            };

            loadChat(true);
            setInterval(function () { loadChat(false); }, 2500);
        })();
    </script>
</body>

</html>
