<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Code Verification | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.12);
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d4ed8;
            font-size: 28px;
        }

        h2 {
            margin: 0 0 8px;
            color: #0f172a;
            font-size: 22px;
        }

        .card>p {
            color: #475569;
            font-size: 14px;
            margin: 0 0 18px;
            line-height: 1.5;
        }

        .error {
            display: none;
            background: #fee2e2;
            color: #991b1b;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: left;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 22px;
            letter-spacing: 10px;
            text-align: center;
            margin-bottom: 14px;
            color: #0f172a;
            background: #fff;
        }

        input:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3px rgba(29, 78, 216, .15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #071a52;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background: #0a2a7a;
        }

        a.back {
            display: inline-block;
            margin-top: 16px;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        a.back:hover {
            text-decoration: underline;
        }

        /* Customer service — always visible on light bg */
        .customer-service {
            position: fixed;
            right: 18px;
            bottom: 22px;
            z-index: 50;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 0;
            cursor: pointer;
            background: #071a52;
            color: #fff;
            box-shadow: 0 8px 24px rgba(7, 26, 82, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .customer-service:hover {
            background: #0a2a7a;
        }

        .customer-service i {
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon"><i class="fas fa-file-invoice-dollar"></i></div>
        <h2>Tax Code Verification</h2>
        <p>Enter the 4-digit Tax Code to complete your transfer.</p>
        <div class="error" id="errorMsg"></div>
        <form id="taxForm">
            <input type="text" id="taxCode" maxlength="4" inputmode="numeric" placeholder="••••" required
                autocomplete="off">
            <button type="submit">Verify & Continue</button>
        </form>
        <a class="back" href="/dashboard"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- Customer service → full support page (X exit there goes back / to dashboard) -->
    <button type="button" class="customer-service" id="customerIcon" title="Customer Service"
        aria-label="Customer Service">
        <i class="fas fa-headset"></i>
    </button>

    <script src="/fsw-shared.js"></script>
    <script>
        if (!fswRequireAuth()) { }

        document.getElementById('customerIcon').onclick = function () {
            window.location.href = '/support';
        };

        const form = document.getElementById('taxForm');
        const errorMsg = document.getElementById('errorMsg');
        const input = document.getElementById('taxCode');
        input.addEventListener('input', () => {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            errorMsg.style.display = 'none';
        });
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = input.value.trim();
            const transferId = sessionStorage.getItem('fsw_pending_transfer_id');
            if (!transferId) {
                errorMsg.textContent = 'No pending transfer. Start again from transfer page.';
                errorMsg.style.display = 'block';
                return;
            }
            if (code.length !== 4) {
                errorMsg.textContent = 'Enter a 4-digit Tax code.';
                errorMsg.style.display = 'block';
                return;
            }
            const btn = form.querySelector('button[type=submit]');
            fswBtnStart(btn, 'Verifying...');
            try {
                const res = await fetch(FSW_API_BASE + '/transfers/' + transferId + '/verify-tax', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taxCode: code }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Invalid Tax code');
                if (data.newBalance != null && typeof fswSetCachedBalance === 'function') fswSetCachedBalance(data.newBalance);
                sessionStorage.setItem('fsw_receipt_transfer_id', transferId);
                sessionStorage.removeItem('fsw_pending_transfer_id');
                if (typeof fswBumpCompletedTransfers === 'function') fswBumpCompletedTransfers();
                window.location.href = '/receipt';
            } catch (err) {
                errorMsg.textContent = err.message === 'Failed to fetch'
                    ? "Can't reach the backend."
                    : err.message;
                errorMsg.style.display = 'block';
                input.value = '';
                fswBtnStop(btn);
            }
        });
    </script>

    <script>
        try {
            history.pushState({ fswGuard: 1 }, '', location.href);
            window.addEventListener('popstate', function () {
                location.replace('/dashboard');
            });
        } catch (e) { }
    </script>
</body>

</html>
