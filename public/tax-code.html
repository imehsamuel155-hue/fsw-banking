<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Code Verification | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #071a52, #0b63ce);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
            text-align: center;
        }

        .card h2 {
            color: #071a52;
            margin: 0 0 8px;
            font-size: 22px;
        }

        .card p {
            color: #666;
            font-size: 14px;
            margin: 0 0 24px;
        }

        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #eef4ff;
            color: #0b63ce;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            border: 1px solid #d0d7e6;
            border-radius: 10px;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 12px;
        }

        input:focus {
            outline: none;
            border-color: #0b63ce;
        }

        button[type=submit] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0b63ce;
            color: #fff;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }

        button[type=submit]:hover {
            background: #094fa3;
        }

        .error {
            display: none;
            background: #fde8e8;
            color: #a6432b;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .back {
            display: inline-block;
            margin-top: 16px;
            color: #0b63ce;
            text-decoration: none;
            font-size: 14px;
        }

        /* Floating customer service — same idea as dashboard */
        .customer-service {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #0b63ce;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(11, 99, 206, .4);
            z-index: 100;
            border: none;
        }

        .customer-service:hover {
            background: #094fa3;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .customer-service {
                bottom: 16px;
                right: 16px;
                width: 50px;
                height: 50px;
                font-size: 22px;
            }

            .card {
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon"><i class="fas fa-file-invoice-dollar"></i></div>
        <h2>Tax Code Verification</h2>
        <p>Enter the 4-digit Tax Code to complete your transfer.</p>
        <div class="error" id="errorMsg"></div>
        <form id="taxForm">
            <input type="text" id="taxCode" maxlength="4" inputmode="numeric" placeholder="••••" required
                autocomplete="off">
            <button type="submit">Verify & Continue</button>
        </form>
        <a class="back" href="/dashboard"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>

    <!-- Customer service → full support page (X exit there goes back / to dashboard) -->
    <button type="button" class="customer-service" id="customerIcon" title="Customer Service"
        aria-label="Customer Service">
        <i class="fas fa-headset"></i>
    </button>

    <script src="/fsw-shared.js"></script>
    <script>
        if (!fswRequireAuth()) { }

        document.getElementById('customerIcon').onclick = function () {
            window.location.href = '/support';
        };

        const form = document.getElementById('taxForm');
        const errorMsg = document.getElementById('errorMsg');
        const input = document.getElementById('taxCode');
        input.addEventListener('input', () => {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 4);
            errorMsg.style.display = 'none';
        });
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = input.value.trim();
            const transferId = sessionStorage.getItem('fsw_pending_transfer_id');
            if (!transferId) {
                errorMsg.textContent = 'No pending transfer. Start again from transfer page.';
                errorMsg.style.display = 'block';
                return;
            }
            if (code.length !== 4) {
                errorMsg.textContent = 'Enter a 4-digit Tax code.';
                errorMsg.style.display = 'block';
                return;
            }
            const btn = form.querySelector('button[type=submit]');
            fswBtnStart(btn, 'Verifying...');
            try {
                const res = await fetch(FSW_API_BASE + '/transfers/' + transferId + '/verify-tax', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taxCode: code }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Invalid Tax code');
                if (data.newBalance != null && typeof fswSetCachedBalance === 'function') fswSetCachedBalance(data.newBalance);
                sessionStorage.setItem('fsw_receipt_transfer_id', transferId);
                sessionStorage.removeItem('fsw_pending_transfer_id');
                if (typeof fswBumpCompletedTransfers === 'function') fswBumpCompletedTransfers();
                window.location.href = '/receipt';
            } catch (err) {
                errorMsg.textContent = err.message === 'Failed to fetch'
                    ? "Can't reach the backend."
                    : err.message;
                errorMsg.style.display = 'block';
                input.value = '';
                fswBtnStop(btn);
            }
        });
    </script>

    <script>
        try {
            history.pushState({ fswGuard: 1 }, '', location.href);
            window.addEventListener('popstate', function () {
                location.replace('/dashboard');
            });
        } catch (e) { }
    </script>
</body>

</html>
