    <script>if (!fswRequireAuth()) { }</script>
    <script>

        const transferForm = document.getElementById("internationalTransferForm");

        if (transferForm) {

            transferForm.addEventListener("submit", async function (e) {

                e.preventDefault();

                const transferData = {
                    type: 'international',
                    recipientName: document.getElementById("recipientName").value,
                    recipientBank: document.getElementById("recipientBank").value,
                    iban: document.getElementById("accountNumber").value,
                    swift: document.getElementById("swiftCode").value,
                    country: document.getElementById("country").value,
                    currency: document.getElementById("currency").value,
                    amount: Number(document.getElementById("amount").value),
                    purpose: document.getElementById("purpose").value,
                };

                const submitBtn = transferForm.querySelector('button[type="submit"]');
                if (submitBtn) submitBtn.disabled = true;

                try {
                    const userId = await fswGetCurrentUserId();
                    const res = await fetch(`${FSW_API_BASE}/transfers`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId, ...transferData }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Transfer could not be created');

                    sessionStorage.setItem('fsw_pending_transfer_id', data._id);
                    window.location.href = '/tic-code';
                } catch (err) {
                    alert(err.message === 'Failed to fetch'
                        ? "Can't reach the backend — make sure it's running (npm run dev)."
                        : err.message);
                } finally {
                    if (submitBtn) submitBtn.disabled = false;
                }

            });

        }

    </script>
