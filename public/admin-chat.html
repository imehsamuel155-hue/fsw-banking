<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin Chat | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            background: #e8ecf3;
        }

        .shell {
            display: flex;
            height: 100%;
            height: 100dvh;
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            position: relative;
        }

        .sidebar {
            width: 300px;
            border-right: 1px solid #e6ebf3;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            transition: transform .25s ease;
        }

        .side-top {
            padding: 12px;
            background: #071a52;
            color: #fff;
            flex-shrink: 0;
        }

        .side-top a {
            color: #fff;
            font-size: 13px;
            text-decoration: none;
        }

        .side-top h1 {
            font-size: 15px;
            margin: 8px 0 0;
        }

        #convList {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .conv {
            padding: 12px 14px;
            border-bottom: 1px solid #eef1f6;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .conv:hover,
        .conv.active {
            background: #e8f0fe;
        }

        .conv .num {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #0b63ce;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .conv .num.muted {
            background: #94a3b8;
        }

        .conv .body {
            flex: 1;
            min-width: 0;
        }

        .conv .name {
            font-weight: 600;
            font-size: 14px;
            color: #071a52;
        }

        .conv .preview {
            font-size: 12px;
            color: #667;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv .badge {
            flex-shrink: 0;
            min-width: 20px;
            height: 20px;
            border-radius: 999px;
            background: #a6432b;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .conv .badge.show {
            display: flex;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .main-top {
            padding: 12px 14px;
            border-bottom: 1px solid #e6ebf3;
            background: #071a52;
            color: #fff;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .main-top .who {
            font-size: 14px;
            font-weight: 600;
        }

        .main-top .mode {
            font-size: 11px;
            opacity: .85;
        }

        .nav-toggle {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, .15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .nav-toggle .dot {
            position: absolute;
            top: 4px;
            right: 4px;
            min-width: 18px;
            height: 18px;
            border-radius: 999px;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .nav-toggle .dot.show {
            display: flex;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 12px;
            background: #f0f2f5;
            min-height: 0;
        }

        .row {
            display: flex;
            width: 100%;
            margin-bottom: 10px;
        }

        .row.from-customer {
            justify-content: flex-start;
        }

        .row.from-admin {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bubble.customer {
            background: #e2e8f0;
            color: #1a202c;
            border-bottom-left-radius: 4px;
        }

        .bubble.admin {
            background: #0b63ce;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .bubble .meta {
            font-size: 10px;
            opacity: .7;
            margin-top: 4px;
        }

        .bubble img {
            display: block;
            max-width: min(200px, 60vw);
            max-height: 200px;
            border-radius: 10px;
            margin-top: 6px;
            cursor: pointer;
        }

        .footer {
            flex-shrink: 0;
            background: #fff;
            border-top: 1px solid #e6ebf3;
            padding: 10px 12px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .footer input[type=text] {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d0d7e6;
            border-radius: 24px;
            font-size: 15px;
        }

        .footer button,
        .footer label {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: #0b63ce;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .4);
            z-index: 20;
        }

        .scrim.show {
            display: block;
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .92);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #lightbox.show {
            display: flex;
        }

        #lightbox img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 8px;
        }

        #lightbox .x {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        @media (max-width: 800px) {
            .nav-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 30;
                width: min(320px, 88vw);
                transform: translateX(-105%);
                box-shadow: 8px 0 24px rgba(0, 0, 0, .15);
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <div class="scrim" id="scrim"></div>
    <div class="shell">
        <div class="sidebar" id="sidebar">
            <div class="side-top">
                <a href="/admin"><i class="fas fa-arrow-left"></i> Admin board</a>
                <h1>All conversations</h1>
                <p style="font-size:11px;opacity:.8;margin-top:4px;">Tap a name to reply only to that customer</p>
            </div>
            <div id="convList"></div>
        </div>
        <div class="main">
            <div class="main-top">
                <button type="button" class="nav-toggle" id="navToggle" title="Conversations">
                    <i class="fas fa-bars"></i>
                    <span class="dot" id="navBadge">0</span>
                </button>
                <div style="flex:1;min-width:0;">
                    <div class="who" id="whoTitle">Select a conversation</div>
                    <div class="mode" id="modeLabel">Open the menu to pick who to reply</div>
                </div>
                <button type="button" id="clearBtn"
                    style="border:none;border-radius:8px;padding:8px 12px;background:#a6432b;color:#fff;cursor:pointer;font-size:12px;">Clear…</button>
            </div>
            <div id="chatMessages"></div>
            <div class="footer">
                <input type="text" id="chatInput" placeholder="Type a reply…" autocomplete="off">
                <label title="Photo"><i class="fas fa-image"></i><input type="file" accept="image/*" hidden
                        id="chatImage"></label>
                <button type="button" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
    <div id="lightbox"><button type="button" class="x" id="lbClose">&times;</button><img id="lbImg" alt=""></div>
    <script src="/fsw-shared.js"></script>
    <script>
        (function () {
            if (!fswGetAdminToken()) { location.replace('/admin'); return; }
            var selectedId = null;
            var selectedName = '';
            var convs = [];
            var box = document.getElementById('chatMessages');
            var listEl = document.getElementById('convList');
            var sidebar = document.getElementById('sidebar');
            var scrim = document.getElementById('scrim');
            var lastCount = -1;

            function openNav() { sidebar.classList.add('open'); scrim.classList.add('show'); }
            function closeNav() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }
            document.getElementById('navToggle').onclick = function () {
                if (sidebar.classList.contains('open')) closeNav(); else openNav();
            };
            scrim.onclick = closeNav;

            function openLb(src) {
                document.getElementById('lbImg').src = src;
                document.getElementById('lightbox').classList.add('show');
            }
            document.getElementById('lbClose').onclick = function () {
                document.getElementById('lightbox').classList.remove('show');
            };

            async function loadConvs() {
                var res = await fetch(FSW_API_BASE + '/users/admin/conversations', {
                    headers: { Authorization: 'Bearer ' + fswGetAdminToken() },
                    cache: 'no-store'
                });
                convs = await res.json();
                if (!res.ok) throw new Error(convs.error || 'Failed to load chats');
                if (!Array.isArray(convs)) convs = [];

                // accounts with customer messages for badge
                var withUnread = convs.filter(function (c) { return (c.unreadCount > 0) || (c.messageCount > 0 && c.unreadHint); });
                var badge = document.getElementById('navBadge');
                if (withUnread.length) {
                    badge.textContent = String(withUnread.length);
                    badge.classList.add('show');
                } else {
                    badge.classList.remove('show');
                }

                listEl.innerHTML = convs.map(function (c, idx) {
                    var active = selectedId && String(selectedId) === String(c.userId) ? ' active' : '';
                    var n = idx + 1;
                    var unread = Number(c.unreadCount || 0);
                    var badgeHtml = unread > 0
                        ? '<span class="badge show">' + unread + '</span>'
                        : (c.messageCount > 0 ? '' : '');
                    return '<div class="conv' + active + '" data-id="' + c.userId + '" data-name="' + String(c.name || 'Customer').replace(/"/g, '') + '">' +
                        '<div class="num' + (c.messageCount ? '' : ' muted') + '">' + n + '</div>' +
                        '<div class="body"><div class="name">' + (c.name || 'Customer') +
                        (c.username ? ' <span style="font-weight:400;color:#0b63ce;font-size:12px;">@' + c.username + '</span>' : '') +
                        '</div><div class="preview">' + (c.lastMessage || 'No messages yet') + '</div></div>' +
                        (unread > 0 ? '<span class="badge show">' + unread + '</span>' : '') +
                        '</div>';
                }).join('') || '<div style="padding:16px;color:#888;font-size:13px;">No conversations yet. When customers message from the site, they appear here numbered 1, 2, 3…</div>';

                listEl.querySelectorAll('.conv').forEach(function (el) {
                    el.onclick = function () {
                        selectedId = el.dataset.id;
                        selectedName = el.dataset.name;
                        document.getElementById('whoTitle').textContent = selectedName;
                        document.getElementById('modeLabel').textContent = 'Replying only to this customer — messages stay private to this account';
                        lastCount = -1;
                        closeNav();
                        // Mark this conversation read (clears the 1 badge for this user only)
                        fetch(FSW_API_BASE + '/chat/' + selectedId + '/mark-read', {
                            method: 'POST',
                            headers: { Authorization: 'Bearer ' + fswGetAdminToken() }
                        }).catch(function () { });
                        loadConvs().then(function () { loadMessages(true); });
                    };
                });
            }

            function addBubble(msg) {
                var admin = String(msg.sender) === 'admin';
                var row = document.createElement('div');
                row.className = 'row ' + (admin ? 'from-admin' : 'from-customer');
                var b = document.createElement('div');
                b.className = 'bubble ' + (admin ? 'admin' : 'customer');
                if (msg.text) {
                    var t = document.createElement('div');
                    t.textContent = msg.text;
                    b.appendChild(t);
                }
                if (msg.image) {
                    var im = document.createElement('img');
                    im.src = msg.image;
                    im.onclick = function () { openLb(msg.image); };
                    b.appendChild(im);
                }
                var meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = admin ? 'You (admin)' : (selectedName || 'Customer');
                b.appendChild(meta);
                row.appendChild(b);
                box.appendChild(row);
            }

            async function loadMessages(force) {
                if (!selectedId) {
                    box.innerHTML = '<div style="text-align:center;color:#888;padding:40px 16px;font-size:14px;">Open the <b>menu</b> (☰) and pick conversation <b>1</b>, <b>2</b>, <b>3</b>… to reply.<br><br>Each customer only sees their own chat.</div>';
                    return;
                }
                var msgs = await fswGetChat(selectedId);
                if (!Array.isArray(msgs)) msgs = [];
                if (msgs.length === lastCount && !force) return;
                lastCount = msgs.length;
                box.innerHTML = '';
                if (!msgs.length) box.innerHTML = '<div style="text-align:center;color:#888;padding:30px;">No messages yet for this customer.</div>';
                else msgs.forEach(addBubble);
                box.scrollTop = box.scrollHeight;
            }

            async function send(text, image) {
                text = (text || '').trim();
                if (!text && !image) return;
                if (!selectedId) {
                    alert('Open the menu and select a conversation (1, 2, 3…) before replying.');
                    openNav();
                    return;
                }
                try {
                    await fswSendAdminReply(selectedId, text, image || '');
                    document.getElementById('chatInput').value = '';
                    await loadMessages(true);
                    await loadConvs();
                } catch (e) { alert(e.message || 'Send failed'); }
            }

            document.getElementById('sendBtn').onclick = function () { send(document.getElementById('chatInput').value); };
            document.getElementById('chatInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); send(this.value); }
            });
            document.getElementById('chatImage').onchange = function (e) {
                var f = e.target.files && e.target.files[0];
                if (!f) return;
                var r = new FileReader();
                r.onload = function () { send('', r.result); };
                r.readAsDataURL(f);
                e.target.value = '';
            };
            document.getElementById('clearBtn').onclick = async function () {
                try {
                    await loadConvs();
                    var lines = ['1) Clear ALL chats'];
                    convs.forEach(function (c, i) {
                        if (c.messageCount > 0) lines.push((lines.length + 1) + ') Clear only: ' + (c.name || c.username || c.userId));
                    });
                    var choice = prompt(lines.join('\n') + '\n\nType the number:');
                    var n = parseInt(choice, 10);
                    if (!n || n < 1 || n > lines.length) return;
                    if (n === 1) {
                        if (!confirm('Delete ALL chats?')) return;
                        await fetch(FSW_API_BASE + '/chat/admin/clear', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + fswGetAdminToken() },
                            body: JSON.stringify({ userIds: 'all' })
                        });
                    } else {
                        var withMsg = convs.filter(function (c) { return c.messageCount > 0; });
                        var target = withMsg[n - 2];
                        if (!target || !confirm('Clear chat for ' + target.name + '?')) return;
                        await fetch(FSW_API_BASE + '/chat/admin/clear', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + fswGetAdminToken() },
                            body: JSON.stringify({ userIds: [target.userId] })
                        });
                    }
                    lastCount = -1;
                    await loadConvs();
                    await loadMessages(true);
                } catch (e) { alert(e.message); }
            };

            loadConvs().catch(function (e) {
                listEl.innerHTML = '<div style="padding:12px;color:#a00;">' + e.message + '</div>';
            });
            setInterval(function () {
                loadConvs().catch(function () { });
                if (selectedId) loadMessages(false).catch(function () { });
            }, 3000);
        })();
    </script>
</body>

</html>
