<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Statement | First Smart Wave Banking</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fc;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dashboard-header {
            background: #071a52;
            color: #fff;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dashboard-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .dashboard-header a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
        }

        .statement-container {
            width: 92%;
            max-width: 920px;
            margin: 24px auto 40px;
            flex: 1;
        }

        .statement-card {
            background: #fff;
            border-radius: 18px;
            padding: 28px 22px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .08);
        }

        .statement-card h2 {
            color: #071a52;
            margin: 0 0 8px;
            font-size: 22px;
        }

        .sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tx-item {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 16px;
            background: #fafbfc;
        }

        .tx-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .tx-name {
            font-weight: 700;
            color: #071a52;
            font-size: 15px;
        }

        .tx-amt {
            font-weight: 800;
            color: #b91c1c;
            font-size: 16px;
            white-space: nowrap;
        }

        .tx-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 8px;
            font-size: 12.5px;
            color: #64748b;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.local {
            background: #e0f2fe;
            color: #0369a1;
        }

        .badge.intl {
            background: #fef3c7;
            color: #b45309;
        }

        .badge.ok {
            background: #dcfce7;
            color: #166534;
        }

        .tx-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tx-actions button,
        .tx-actions a {
            border: 0;
            background: #071a52;
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .tx-actions button.ghost {
            background: #e2e8f0;
            color: #071a52;
        }

        .tx-detail {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #cbd5e1;
            font-size: 13px;
            color: #334155;
            line-height: 1.55;
        }

        .tx-detail.open {
            display: block;
        }

        .empty {
            text-align: center;
            padding: 40px 16px;
            color: #64748b;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .buttons a {
            flex: 1;
            min-width: 160px;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            background: #071a52;
        }

        .buttons a.secondary {
            background: #64748b;
        }

        @media (max-width: 600px) {
            .statement-card {
                padding: 20px 14px;
            }
        }
    </style>
</head>

<body>
    <header class="dashboard-header">
        <a href="/dashboard" title="Back"><i class="fas fa-arrow-left"></i></a>
        <h2>Transaction Statement</h2>
    </header>

    <div class="statement-container">
        <div class="statement-card">
            <h2><i class="fas fa-file-invoice"></i> Transaction History</h2>
            <p class="sub">Local and international transfers appear here after they complete. Tap a row for more details
                or open the slip.</p>
            <div id="txList" class="tx-list">
                <div class="empty">Loading history…</div>
            </div>
            <div class="buttons">
                <a href="/dashboard">Dashboard</a>
                <a class="secondary" href="/local-transfer">New transfer</a>
            </div>
        </div>
    </div>

    <script src="/fsw-shared.js"></script>
    <script>
        if (typeof fswRequireAuth === 'function') fswRequireAuth();

        function fmtMoney(n, cur) {
            var x = Number(n);
            if (isNaN(x)) x = 0;
            try {
                return (cur || '') + ' ' + x.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            } catch (e) {
                return (cur || '') + ' ' + x.toFixed(2);
            }
        }

        function fmtDate(t) {
            try {
                if (t.displayDate) return t.displayDate;
                var d = new Date(t.createdAt || Date.now());
                return d.toLocaleString();
            } catch (e) { return '—'; }
        }

        function render(list) {
            var box = document.getElementById('txList');
            if (!list || !list.length) {
                box.innerHTML = '<div class="empty">No completed transfers yet.<br>When you finish a local or international transfer, it will show here.</div>';
                return;
            }
            box.innerHTML = '';
            list.forEach(function (t, i) {
                var isIntl = t.type === 'international';
                var item = document.createElement('div');
                item.className = 'tx-item';
                item.innerHTML =
                    '<div class="tx-top">' +
                    '<div class="tx-name">' + (t.recipientName || 'Transfer') + '</div>' +
                    '<div class="tx-amt">− ' + fmtMoney(t.amount, t.currency || '') + '</div>' +
                    '</div>' +
                    '<div class="tx-meta">' +
                    '<span class="badge ' + (isIntl ? 'intl' : 'local') + '">' + (isIntl ? 'International' : 'Local') + '</span>' +
                    '<span class="badge ok">' + (t.status || 'completed') + '</span>' +
                    '<span>' + fmtDate(t) + '</span>' +
                    '<span>Ref: ' + (t.reference || '—') + '</span>' +
                    '</div>' +
                    '<div class="tx-actions">' +
                    '<button type="button" class="ghost" data-more="' + i + '">Tap to see more</button>' +
                    (t._id ? '<a href="/receipt?id=' + encodeURIComponent(t._id) + '">Preview slip</a>' : '') +
                    '</div>' +
                    '<div class="tx-detail" id="det' + i + '"></div>';
                box.appendChild(item);
                var det = item.querySelector('.tx-detail');
                det.innerHTML =
                    '<div><b>Recipient:</b> ' + (t.recipientName || '—') + '</div>' +
                    '<div><b>Bank:</b> ' + (t.recipientBank || '—') + '</div>' +
                    '<div><b>Account:</b> ' + (t.recipientAccountNumber || t.iban || '—') + '</div>' +
                    (isIntl ? '<div><b>SWIFT:</b> ' + (t.swift || '—') + ' · <b>Country:</b> ' + (t.country || '—') + '</div>' : '') +
                    '<div><b>Purpose:</b> ' + (t.purpose || t.description || '—') + '</div>' +
                    '<div><b>Charge:</b> ' + fmtMoney(t.bankCharge || 0, t.currency || '') + '</div>';
            });
            box.querySelectorAll('[data-more]').forEach(function (btn) {
                btn.onclick = function () {
                    var det = document.getElementById('det' + btn.getAttribute('data-more'));
                    if (!det) return;
                    det.classList.toggle('open');
                    btn.textContent = det.classList.contains('open') ? 'Hide details' : 'Tap to see more';
                };
            });
        }

        (async function () {
            try {
                var id = typeof fswGetCurrentUserId === 'function' ? await fswGetCurrentUserId() : null;
                if (!id) {
                    document.getElementById('txList').innerHTML = '<div class="empty">Please log in to view history.</div>';
                    return;
                }
                var res = await fetch(FSW_API_BASE + '/transfers/history/' + encodeURIComponent(id) + '?_=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('Could not load history');
                var list = await res.json();
                render(Array.isArray(list) ? list : []);
            } catch (e) {
                document.getElementById('txList').innerHTML = '<div class="empty">' + (e.message || 'Failed to load') + '</div>';
            }
        })();
    </script>
</body>

</html>
