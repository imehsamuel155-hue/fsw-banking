<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | First Smart Wave Banking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #0d233a;
            --secondary-color: #0066cc;
            --error-color: #e74c3c;
        }

        body {
            background: linear-gradient(135deg, #0d233a 0%, #1a3a5c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
            overflow: hidden;
        }

        .login-header {
            background: var(--primary-color);
            color: #fff;
            padding: 30px 20px;
            text-align: center;
        }

        .logo-icon {
            background: var(--secondary-color);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-weight: bold;
            font-size: 1.4rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .login-header small {
            color: #a0b2c6;
            font-size: 0.85rem;
        }

        .login-body {
            padding: 30px 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        .input-field {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field i {
            position: absolute;
            left: 14px;
            color: #666;
        }

        .input-field input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #e1e8ed;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-field input:focus {
            border-color: var(--secondary-color);
        }

        .error-message {
            background: #fceae9;
            color: var(--error-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            border: 1px solid #f5c6cb;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--secondary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: #0052a3;
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: wait;
        }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
        }

        .login-footer a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .hint {
            margin-top: 14px;
            font-size: 0.78rem;
            color: #888;
            text-align: center;
        }

        #suspendOverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #0a0a0a;
            color: #fff;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 24px;
        }

        #suspendOverlay.show {
            display: flex;
        }

        #suspendOverlay h1 {
            font-size: clamp(1.1rem, 4vw, 1.6rem);
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.45;
            max-width: 520px;
            color: #ff4d4d;
        }

        #suspendOverlay p {
            margin-top: 16px;
            color: #aaa;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="suspendOverlay" role="alert">
        <h1>ACCOUNT SUSPENDED DUE TO LOGIN FROM UNAPPROVED LOCATION</h1>
        <p>Access is temporarily unavailable. Contact support if you need help.</p>
    </div>

    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">FSW</div>
            <h2>First Smart Wave Banking</h2>
            <small>Secure Customer Sign In</small>
        </div>
        <div class="login-body">
            <div class="error-message" id="errorBanner">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid login details.</span>
            </div>
            <form id="loginForm" action="javascript:void(0)" method="post">
                <div class="input-group">
                    <label>Username</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter username" required
                            autocomplete="username">
                    </div>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter password" required
                            autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="login-footer">
                <p><a href="/"><i class="fas fa-arrow-left"></i> Back to Homepage</a></p>
            </div>
        </div>
    </div>
    <script src="/fsw-shared.js"></script>
    <script>
        (function () {
            var form = document.getElementById('loginForm');
            var btn = document.getElementById('loginBtn');
            var errorBanner = document.getElementById('errorBanner');
            var errorText = document.getElementById('errorText');
            var btnHtml = btn ? btn.innerHTML : '';

            function showError(msg) {
                if (errorText) errorText.textContent = msg;
                if (errorBanner) errorBanner.style.display = 'flex';
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = btnHtml;
                }
            }

            function apiBase() {
                try {
                    if (typeof FSW_API_BASE === 'string' && FSW_API_BASE) return FSW_API_BASE;
                } catch (e) { }
                var h = location.hostname;
                if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:5000/api';
                return 'https://fsw-banking.onrender.com/api';
            }

            // If admin turned lock ON, show full-screen block immediately
            fetch(apiBase() + '/settings/public-status')
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d && d.loginsBlocked) {
                        var ov = document.getElementById('suspendOverlay');
                        if (ov) ov.classList.add('show');
                    }
                })
                .catch(function () { });

            if (!form) return;

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                e.stopPropagation();

                var username = (document.getElementById('username').value || '').trim();
                var password = document.getElementById('password').value || '';

                if (!username || !password) {
                    showError('Enter username and password.');
                    return;
                }

                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                }
                if (errorBanner) errorBanner.style.display = 'none';

                var url = apiBase() + '/auth/login';
                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        country: (Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown')
                    })
                })
                    .then(function (res) {
                        return res.json().then(function (data) {
                            return { ok: res.ok, status: res.status, data: data };
                        });
                    })
                    .then(function (result) {
                        if (!result.ok) {
                            if (result.data && result.data.code === 'LOGINS_BLOCKED') {
                                var ov = document.getElementById('suspendOverlay');
                                if (ov) ov.classList.add('show');
                                throw new Error(result.data.error || 'ACCOUNT SUSPENDED DUE TO LOGIN FROM UNAPPROVED LOCATION');
                            }
                            throw new Error((result.data && result.data.error) || 'Invalid username or password');
                        }
                        var userId = result.data.userId;
                        var token = result.data.token;
                        var uname = result.data.username || username;
                        if (!userId || !token) throw new Error('Login response incomplete. Try again.');

                        try {
                            if (typeof fswSetLoggedInUser === 'function') {
                                fswSetLoggedInUser(String(userId), String(token), uname);
                            } else {
                                localStorage.clear();
                                localStorage.setItem('fsw_user_id', String(userId));
                                localStorage.setItem('fsw_token', String(token));
                                localStorage.setItem('fsw_username', String(uname || ''));
                            }
                        } catch (err) {
                            throw new Error('Could not save session. Allow site data in browser.');
                        }

                        window.location.href = '/pin';
                    })
                    .catch(function (err) {
                        var msg = (err && err.message) ? err.message : 'Login failed';
                        if (msg === 'Failed to fetch' || msg.indexOf('NetworkError') !== -1) {
                            msg = "Can't reach the server. Wait 30s (Render may be waking up) and try again.";
                        }
                        showError(msg);
                    });
            });
        })();
    </script>
</body>

</html>
